services:
  db:
    image: postgres:16-alpine
    container_name: lti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lti_db
      POSTGRES_USER: lti_user
      POSTGRES_PASSWORD: lti_password
    ports:
      - "5432:5432"
    volumes:
      - lti_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lti_user -d lti_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lti_db_data:
