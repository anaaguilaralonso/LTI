services:
  db:
    image: postgres:16-alpine
    container_name: lti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lti_db
      POSTGRES_USER: lti_user
      POSTGRES_PASSWORD: lti_password
    ports:
      - "5432:5432"
    volumes:
      - lti_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lti_user -d lti_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lti-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/lti_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  lti_db_data:
